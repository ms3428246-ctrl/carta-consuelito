<script>
const pages=[
{title:'Portada',html:`<div class="cover"><div class="ribbon">🎈 🎂 🎈</div><h1>Espero te Guste</h1><h2>Consuelito 💗</h2><p class="sub">Lo hice con mucho amor y extrañandote en cada momento.</p><div class="heart">💗</div><p class="small">Toca “Siguiente” para abrir el libro ✨</p></div>`},
{title:'Unas palabras para ti',html:`<div class="heart">💗</div><h2>Quiero decirte algo...</h2><div class="note"><p><b>Querida Consuelito:</b></p><div class="editable" contenteditable="true" data-key="mensaje1">🎂✨ ¡Feliz cumpleaños, amor!✨🎂

Hoy quiero recordarte lo especial que eres para mí. 💕 Gracias por cada momento, cada risa y por estar siempre para mi de una o otra forma. Espero que este nuevo año de vida esté lleno de momentos bonitos, sueños cumplidos y muchísima felicidad.

Nunca olvides lo increíble que eres y lo mucho que vales. 🥹💗

Te quiero muchísimo y deseo que tengas un cumpleaños tan bonito como tú. 🎈🎂✨</div></div></div><p>💐.</p>`},
{title:'Nuestros recuerdos',html:`<h2>Recuerdos que valen mucho 📸</h2><p>Por qué cada momento contigo merece quedarse guardado para siempre 💖.</p><div class="photos"><img src="assets/Imagen_de_portada_.JPG"><img src="assets/18096FF4-57A8-4FE0-801F-F5EFD757758A.jpg"><img src="assets/834B7324-28B5-44B5-BE08-2AD61562B3AD.JPG"><img src="assets/F8D72EC9-302C-49E6-9F8C-63C6DA8AD5DD.JPG"><img src="assets/1B7DA38B-4D14-4D12-AD1F-9220A41EE039.JPG"><img src="assets/436DD556-2F1F-479F-BB56-20BC3C38EBDF.JPG"><img src="assets/6AFF918B-82BB-4125-86E0-41C09B9285B8.jpg"><img src="assets/7059FA32-4581-44FC-94F0-9DF6C94BE9F1.JPG"><img src="assets/IMG_4262.jpg"></div><p class="small">Toca una foto para verla más grande.</p>`},
{title:'Momentos en video',html:`<h2>Un pedacito de nuestros buenos recuerdos 🎥</h2><p>Cada que me extrañes busca estos videos donde siempre fuimos felices.</p><video controls playsinline preload="metadata" src="assets/80C50841-139E-417F-B83C-198FDD83E158.MOV"></video><video controls playsinline preload="metadata" src="assets/IMG_7651.MOV"></video>`},
{title:'Más fotos para ti',html:`<h2>Más recuerdos 📸💗</h2><p>Y todavía hay más momentos que quería guardar en este pequeño libro. 💕</p><div class="note"><div class="editable" contenteditable="true" data-key="mensajeFotos">Consuelito de mi vida y de mi corazón: ❤️🥹

hay personas a las que es imposible explicar con palabras lo mucho que significan para uno, y tú eres una de ellas. Pero hoy, en tu cumpleaños, quiero intentar decirte todo eso que muchas veces no sé cómo expresar.

Primero quiero darte las gracias. Gracias por estar a mi lado, por seguirme en cada locura, por aguantar mi desmadre y por hacerme reír incluso cuando yo no tenía ganas de hacerlo. Gracias por buscar siempre la manera de hacerme feliz, por escucharme, por estar ahí y por convertir momentos malos en recuerdos que ahora me hacen sonreír.

Contigo aprendí que una amistad puede llegar en el momento menos esperado y terminar convirtiéndose en una de las partes más bonitas de tu vida. Y eso eres tú para mí. ❤️

Eres esa amistad que sé que voy a recordar toda mi vida. No solamente por todas las pendejadas que hemos hecho juntas, sino por cómo me has hecho sentir, acompañada, querida y muy feliz. Me encanta cómo nos complementamos, cómo podíamos estar haciendo absolutamente nada y aun así terminar riéndonos como si fuera el mejor día del mundo..</div><div class="hint">❤️‍🩹❤️‍🩹❤️‍🩹❤️‍🩹.</div></div>`},
{title:'Más momentos en video',html:`<h2>Más momentos para recordar 🎥💗</h2><p>Porque son miles de recuerdos que compartimos. ✨</p><video controls playsinline preload="metadata" src="assets/2588a5a774de43a88e9575dd3021b2e0.mp4"></video><video controls playsinline preload="metadata" src="assets/A5B0392D-A904-4AE7-9FD6-81D26A2162F3.mp4"></video><video controls playsinline preload="metadata" src="assets/f51f9b3121034aa6acb25cc5f5a4ad38.mp4"></video><div class="note"><div class="editable" contenteditable="true" data-key="mensajeVideos">Y si algún día la vida nos lleva por caminos diferentes, quiero que nunca olvides que yo siempre voy a guardar esta etapa de mi vida con muchísimo cariño, porque tú formas parte de ella. Y si pudiera volver atrás y escoger nuevamente vivir todo lo que he vivido, volvería a escoger esta etapa, volvería a escoger cada risa, cada abrazo, cada salida y, sobre todo, volvería a escogerte a ti como mi amiga.

También quiero que sepas lo orgullosa que estoy de ti. Eres una chingona, aunque a veces tú misma no lo veas. ❤️ Quiero verte cumplir tus sueños, terminar tu carrera, salir adelante y convertirte en todo eso que alguna vez soñaste ser. Nunca permitas que alguien te haga sentir menos de lo que vales. Tú puedes con esto y con muchísimo más.

Y cuando algún día dudes de ti, acuérdate de mí diciéndote que eres una verga y que yo siempre voy a creer en ti. 😂❤️</div><div class="hint">❤️‍🩹❤️‍🩹❤️‍🩹❤️‍🩹</div></div>`},
{title:'Pide un deseo',html:`<div class="heart">✨</div><h2>Tu pastel  🎂</h2><p>Pide un deseo y toca la llama para apagar la velita. 💗</p><div class="cake-area">
  <div class="cake-wrap">

    <div class="cake-sparkles">
      <span>✨</span>
      <span>✨</span>
      <span>💗</span>
      <span>💗</span>
    </div>

    <div class="cake" id="cake">
      <div class="cream"></div>

      <div class="cake-love">TE AMO ❤️</div>

      <div class="candle">
        <span class="flame" id="flame">🔥</span>
      </div>
    </div>

  </div>
</div><button class="btn secondary" id="resetCake">Encender la velita otra vez 🕯️</button><p id="wish" class="small"></p>`},
{title:'Mi mensaje final',html:`<div style="font-size:54px">🎈💗🎈</div><h2>Antes de terminar...</h2><div class="note"><div class="editable" contenteditable="true" data-key="mensajeFinal">Tenemos todavía muchísimas cosas pendientes: más risas, más salidas, más fotos, más pendejadas y hasta ese tatuaje que algún día me voy hacer  para recordar esta amistad . Porque quiero que, cuando lo veamos dentro de muchos años, podamos decir: “qué pendeja estás Fany al hacer algo así , pero qué felices éramos juntas.” 🥹❤️

No quiero que nunca olvides lo importante que eres para mí. Tal vez no siempre sepa demostrarlo, tal vez a veces no encuentre las palabras correctas, pero te quiero muchísimo, Consuelo. Y si alguna vez necesitas de mí, para lo que sea, sabes perfectamente dónde encontrarme.

Espero que la vida nos permita seguir encontrándonos una y otra vez, aunque pasen los años, aunque cambiemos, aunque cada una tome su propio camino. Porque hay amistades que simplemente no deberían quedarse en una etapa de la vida, deberían acompañarte en muchas más.

Así que hoy no quiero hablar de cuánto tiempo llevamos siendo amigas ni de todo lo que pueda cambiar en el futuro. Hoy solamente quiero celebrar que existes, que llegaste a mi vida y que tuve la suerte de coincidir contigo.

Feliz cumpleaños, mi niña. 🎂❤️

Deseo de todo corazón que la vida te regale todo lo bonito que mereces, que nunca te falten motivos para sonreír y que siempre tengas a alguien que te recuerde lo increíble que eres.

Y si algún día se te olvida, aquí voy a estar yo para recordártelo.

Te quiero muchísimo, Consuelito. Gracias por ser una de esas personas que hicieron una parte de mi vida muchísimo más bonita. ❤️🥹

Feliz cumpleaños, mi niña. Que sean muchos años más de vida, de locuras y desmadres juntas. 🥹❤️🎂.</div><div class="hint">Disfruta tu Dia.</div></div><p><b>❤️‍🩹Mi amor, si volviera a nacer, lo único que le pediría a la vida
Sería que me pusiera a tu lado de nuevo
Estar ahí, conocernos desde chamacos como nos conocimos
Vivir lo que hemos vivido
Y lo único que le pido a la vida de aquí en un futuro
Es que me deje seguir estando a tu lado
Un día prometimos llegar a viejitos juntos
Y ojalá que así sea 
Te amo mucho, mi morenita❤️‍🩹</b></p><button class="btn" id="finalBtn">🎉 Celebrar</button>`}
];
let current=0;const content=document.getElementById('content'),count=document.getElementById('count'),music=document.getElementById('music'),start=document.getElementById('start'),right=document.getElementById('rightPage');
function saveEdits(){document.querySelectorAll('.editable').forEach(e=>localStorage.setItem('consuelito_'+e.dataset.key,e.innerHTML))}
function restoreEdits(){document.querySelectorAll('.editable').forEach(e=>{let v=localStorage.getItem('consuelito_'+e.dataset.key);if(v)e.innerHTML=v;e.addEventListener('input',saveEdits)})}
function render(){content.innerHTML=pages[current].html;count.textContent=pages[current].title+' · '+(current+1)+' / '+pages.length;document.getElementById('prev').style.visibility=current===0?'hidden':'visible';document.getElementById('next').textContent=current===pages.length-1?'Volver a la portada ↺':'Siguiente →';restoreEdits();bindPage();content.scrollTop=0}
function go(n){current=(n+pages.length)%pages.length;right.classList.remove('turning');void right.offsetWidth;right.classList.add('turning');render()}
function bindPage(){document.querySelectorAll('.photos img').forEach(img=>img.onclick=()=>{document.getElementById('bigImg').src=img.src;document.getElementById('lightbox').style.display='flex'});let flame=document.getElementById('flame');if(flame)flame.onclick=()=>{document.getElementById('cake').classList.add('out');document.getElementById('wish').textContent='✨ ¡Deseo pedido! Ojalá se cumpla. 💗';burst()};let reset=document.getElementById('resetCake');if(reset)reset.onclick=()=>{document.getElementById('cake').classList.remove('out');document.getElementById('wish').textContent=''};let final=document.getElementById('finalBtn');if(final)final.onclick=burst}
function burst(){const box=document.getElementById('confetti');box.innerHTML='';for(let i=0;i<55;i++){let s=document.createElement('span');s.className='piece';s.textContent=['💗','✨','🎉','🎈','💕'][Math.floor(Math.random()*5)];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.8+'s';box.appendChild(s)}setTimeout(()=>box.innerHTML='',5000)}
function play(){music.volume=.62;music.play().catch(()=>{})}
document.getElementById('openBtn').onclick=()=>{start.style.display='none';play();burst()};document.getElementById('next').onclick=()=>go(current===pages.length-1?0:current+1);document.getElementById('prev').onclick=()=>{if(current>0)go(current-1)};document.getElementById('musicBtn').onclick=()=>{if(music.paused)play();else music.pause()};document.getElementById('lightbox').onclick=()=>document.getElementById('lightbox').style.display='none';window.addEventListener('load',()=>{render();play()});document.addEventListener('pointerdown',()=>{if(start.style.display!=='none')return;if(music.paused)play()});
</script></body></html>
